parameters:
    sites_scores.project_dir: '%kernel.project_dir%/../../../python_sec/Projet/AUTOMATISATION_SÉCURITÉ'
    sites_scores.python: 'python3'

services:
    _defaults:
        autowire: true      # inject dependencies automatically
        autoconfigure: true # register commands/event subscribers automatically

    # Every class in src/ becomes a service (except Entity, Kernel)
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\SitesScoresRunner:
        arguments:
            $projectDir: '%sites_scores.project_dir%'
            $pythonBinary: '%sites_scores.python%'
